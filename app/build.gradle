apply plugin: 'com.android.application'

android {
    compileSdkVersion 31
    buildToolsVersion '26.0.3'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.finobot.finobot"
        minSdkVersion 16
        targetSdkVersion 31
        versionCode 35
        versionName "1.3.15"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary true
        dataBinding {
            enabled = true
        }
    }
    dexOptions {
        javaMaxHeapSize "4g"
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    productFlavors {
    }
}

configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        if (requested.group == 'com.android.support') {
            if (!requested.name.startsWith("multidex")) {
                details.useVersion '26.1.0' // Updated to a more stable version
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation('cn.trinea.android.view.autoscrollviewpager:android-auto-scroll-view-pager:1.1.2') {
        exclude module: 'support-v4'
    }
    implementation files('libs/arity-2.1.2.jar')
    implementation project(':MPChartLib')
    implementation 'com.jakewharton:butterknife:10.2.3' // Use the latest version
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
//    implementation 'com.jakewharton:butterknife:' + rootProject.ext.butterknifeVer
    implementation 'io.reactivex:rxjava:' + rootProject.ext.rxJavaVer
    implementation 'io.reactivex:rxandroid:' + rootProject.ext.rxAndroidVer
    implementation 'com.squareup:otto:1.3.8'
    implementation 'com.squareup.retrofit2:retrofit:2.0.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.0.2'
    implementation 'com.squareup.okhttp3:okhttp:3.0.0-RC1'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.0.0-RC1'
    implementation 'com.github.rahatarmanahmed:circularprogressview:2.5.0'
    implementation 'com.github.JakeWharton:ViewPagerIndicator:2.4.1'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.google.android.gms:play-services:10.2.1'
    implementation 'com.android.support:multidex:1.0.1'
    implementation 'com.artemzin.rxjava:proguard-rules:1.2.9.0'
    implementation 'com.github.gperez88:calculatorInputView:0.0.3'
    implementation 'com.github.lzyzsd:circleprogress:1.2.1'
    implementation 'joda-time:joda-time:2.9.4'
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'com.squareup.okhttp:okhttp:2.3.0'
    implementation 'com.squareup.retrofit:retrofit:1.9.0'
    implementation 'com.kbeanie:image-chooser-library:1.5.8@aar'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.android.support:design:26.1.0' // Updated to a more stable version
    implementation 'com.android.support:cardview-v7:26.1.0' // Updated to a more stable version
    implementation 'com.android.support:support-v4:26.1.0' // Updated to a more stable version
    implementation 'com.android.support:appcompat-v7:26.1.0' // Updated to a more stable version
    implementation 'com.android.support:support-vector-drawable:26.1.0' // Updated to a more stable version
    implementation 'com.facebook.android:facebook-android-sdk:4.25.0'
    implementation 'com.google.firebase:firebase-messaging:10.2.1'
    implementation 'net.objecthunter:exp4j:0.4.4'
    implementation 'com.github.IsPra94:EasyGifView:1.0.1'
    implementation 'com.github.evrencoskun:TableView:v0.8.9.4' // Uncomment if needed
    //implementation 'com.evrencoskun.library:tableview:0.8.5' // Uncomment if needed
//    implementation 'androidx.core:core:1.12.0' // or the latest version

    testImplementation 'junit:junit:4.12'
}

apply plugin: 'com.google.gms.google-services'
